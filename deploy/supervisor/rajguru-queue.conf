[program:rajguru-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/app
command=/usr/bin/php artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=600
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/app/storage/logs/queue-worker.log
stopwaitsecs=660
